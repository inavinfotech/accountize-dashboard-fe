<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Primary Accountify Background Gradient: Indigo to Blue -->
    <linearGradient id="admin-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Card Gradient matching main app -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Gold Badge Gradient for Admin Shield -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Wallet & Shield Shadow -->
    <filter id="admin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>

    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base App Icon Shape (Matching main Accountify app) -->
  <rect width="512" height="512" rx="120" fill="url(#admin-bg-grad)" />

  <!-- Accountify Wallet & Credit Card Icon -->
  <g filter="url(#admin-shadow)" transform="translate(-16, -20)">
    <!-- Back Card (Poking out of the wallet) -->
    <rect x="190" y="125" width="140" height="90" rx="14" fill="url(#card-grad)" transform="rotate(-15 260 170)" />
    <!-- Magnetic strip on credit card -->
    <rect x="190" y="140" width="140" height="18" fill="#0f172a" transform="rotate(-15 260 170)" opacity="0.8" />
    
    <!-- Main Wallet Body -->
    <rect x="128" y="180" width="256" height="192" rx="28" fill="#ffffff" />
    
    <!-- Wallet Pocket Flap (Clasp) -->
    <path d="M 280 236 L 384 236 C 390 236, 396 242, 396 248 L 396 308 C 396 314, 390 320, 384 320 L 280 320 C 262 320, 248 306, 248 288 L 248 268 C 248 250, 262 236, 280 236 Z" fill="#f1f5f9" />
    
    <!-- Clasp Metal Button -->
    <circle cx="295" cy="278" r="14" fill="url(#admin-bg-grad)" />
    <circle cx="295" cy="278" r="6" fill="#ffffff" />
    
    <!-- Decorative stitching -->
    <rect x="144" y="196" width="224" height="160" rx="18" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-dasharray="8 6" />
  </g>

  <!-- ADMIN OVERLAY BADGE (Bottom-Right Quarter) -->
  <g filter="url(#badge-glow)">
    <!-- Golden Shield Badge Base -->
    <path d="M 384 270 C 430 270, 440 280, 440 310 L 440 380 C 440 430, 384 455, 384 455 C 384 455, 328 430, 328 380 L 328 310 C 328 280, 338 270, 384 270 Z" fill="url(#gold-grad)" stroke="#ffffff" stroke-width="4" />

    <!-- Shield Inner Border -->
    <path d="M 384 282 C 420 282, 428 290, 428 315 L 428 375 C 428 415, 384 438, 384 438 C 384 438, 340 415, 340 375 L 340 315 C 340 290, 348 282, 384 282 Z" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.4" />

    <!-- Admin Crown / Shield Symbol -->
    <path d="M 360 365 L 350 330 L 370 345 L 384 322 L 398 345 L 418 330 L 408 365 Z" fill="#0f172a" />
    <circle cx="384" cy="350" r="4" fill="#fbbf24" />
    
    <!-- ADMIN Text banner -->
    <rect x="352" y="375" width="64" height="20" rx="6" fill="#0f172a" />
    <text x="384" y="389" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="11" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ADMIN</text>
  </g>
</svg>
