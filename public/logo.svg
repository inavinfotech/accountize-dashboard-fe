<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate to Dark Indigo -->
    <linearGradient id="admin-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Gold Badge Gradient for Admin Shield -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shield Glow / Drop Shadow -->
    <filter id="admin-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="badge-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Base App Icon Shape -->
  <rect width="512" height="512" rx="120" fill="url(#admin-bg-grad)" />

  <!-- Subtle Ambient Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3" />

  <!-- Accountify Wallet Icon -->
  <g filter="url(#admin-shadow)" transform="translate(-16, -20)">
    <!-- Back Credit Card -->
    <rect x="180" y="115" width="130" height="85" rx="14" fill="url(#card-grad)" transform="rotate(-15 245 160)" />
    <rect x="180" y="130" width="130" height="16" fill="#0f172a" transform="rotate(-15 245 160)" opacity="0.8" />
    
    <!-- Main Wallet Body -->
    <rect x="120" y="168" width="240" height="180" rx="26" fill="#ffffff" />
    
    <!-- Wallet Flap -->
    <path d="M 265 220 L 360 220 C 366 220, 372 226, 372 232 L 372 288 C 372 294, 366 300, 360 300 L 265 300 C 248 300, 235 287, 235 270 L 235 250 C 235 233, 248 220, 265 220 Z" fill="#f1f5f9" />
    <circle cx="280" cy="260" r="13" fill="#4f46e5" />
    <circle cx="280" cy="260" r="5" fill="#ffffff" />

    <!-- Wallet Stitching -->
    <rect x="135" y="183" width="210" height="150" rx="16" fill="none" stroke="#cbd5e1" stroke-width="3.5" stroke-dasharray="7 5" />
  </g>

  <!-- ADMIN OVERLAY BADGE (Bottom-Right Quarter) -->
  <g filter="url(#badge-glow)">
    <!-- Golden Shield Badge Base -->
    <path d="M 384 270 C 430 270, 440 280, 440 310 L 440 380 C 440 430, 384 455, 384 455 C 384 455, 328 430, 328 380 L 328 310 C 328 280, 338 270, 384 270 Z" fill="url(#gold-grad)" stroke="#fef08a" stroke-width="4" />

    <!-- Shield Inner Border -->
    <path d="M 384 282 C 420 282, 428 290, 428 315 L 428 375 C 428 415, 384 438, 384 438 C 384 438, 340 415, 340 375 L 340 315 C 340 290, 348 282, 384 282 Z" fill="none" stroke="#78350f" stroke-width="2" stroke-opacity="0.4" />

    <!-- Admin Crown / Shield Symbol -->
    <path d="M 360 365 L 350 330 L 370 345 L 384 322 L 398 345 L 418 330 L 408 365 Z" fill="#0f172a" />
    <circle cx="384" cy="350" r="4" fill="#fbbf24" />
    
    <!-- ADMIN Text banner -->
    <rect x="352" y="375" width="64" height="20" rx="6" fill="#0f172a" />
    <text x="384" y="389" font-family="Inter, system-ui, sans-serif" font-weight="900" font-size="11" fill="#fbbf24" text-anchor="middle" letter-spacing="1">ADMIN</text>
  </g>
</svg>
